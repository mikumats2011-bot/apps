<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>よりみちマップ｜わたしだけの思い出地図</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{--ink:#27352f;--muted:#78827a;--paper:#f7f5ef;--card:#fffefa;--green:#527b65;--line:#e8e5dc;--accent:#e6a76b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
    button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:11px 15px;background:var(--green);color:white;font-weight:650}
    button.secondary{background:#edf0e9;color:var(--ink)}button.ghost{background:transparent;color:var(--muted);padding:8px}
    .app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:#e4ecdf;display:grid;place-items:center;font-size:24px}
    h1{font-size:22px;margin:0;letter-spacing:.02em}.sub{font-size:12px;color:var(--muted);margin-top:3px}
    .layout{display:grid;grid-template-columns:350px 1fr;gap:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 20px #29372a0a}
    .map-wrap{position:relative;min-height:650px;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:#e9eee7}
    #map{height:650px;width:100%}.map-tip{position:absolute;z-index:500;left:14px;top:14px;background:#fffefaed;padding:9px 12px;border-radius:12px;font-size:12px;box-shadow:0 2px 10px #0001}
    .searchrow{display:flex;gap:8px}.searchrow input{min-width:0;flex:1}.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fffefa;color:var(--ink);outline-color:var(--green)}
    .section-title{font-size:14px;font-weight:750;margin:19px 0 10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 11px;border-radius:99px;background:#f0f0e9;color:#566158;font-size:12px}.chip.active{background:#dce9dc;color:#345c43}
    .formgrid{display:grid;gap:8px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 0}
    .place-list{display:grid;gap:8px;max-height:290px;overflow:auto}.place{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}.place-icon{width:34px;height:34px;border-radius:11px;background:#f3f1e8;display:grid;place-items:center;font-size:18px;flex:none}.place-main{min-width:0;flex:1}.place-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-meta{font-size:11px;color:var(--muted);margin-top:3px}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:13px}
    .count{font-size:12px;color:var(--muted);font-weight:500}.footer{font-size:11px;color:var(--muted);line-height:1.7;margin-top:16px}
    .leaflet-popup-content-wrapper{border-radius:13px}.leaflet-popup-content{font-family:inherit}
    @media(max-width:800px){.app{padding:14px}.layout{grid-template-columns:1fr}.map-wrap{order:0;min-height:430px}#map{height:430px}.panel{order:1}.top{align-items:flex-start}.top-actions{display:flex;gap:6px}.top-actions button{padding:9px 11px;font-size:12px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">📍</div><div><h1>よりみちマップ</h1><div class="sub">わたしだけの、行った場所コレクション。</div></div></div>
    <div class="top-actions"><button class="secondary" id="locateBtn">◎ 現在地</button><button class="secondary" id="exportBtn">↓ 保存</button><button class="secondary" id="importBtn">↑ 読込</button><input id="importFile" type="file" accept="application/json" hidden><button id="shareBtn">↗ シェア</button></div>
  </header>
  <main class="layout">
    <section class="panel">
      <div class="section-title" style="margin-top:0">場所をさがす</div>
      <div class="searchrow"><input class="field" id="searchInput" placeholder="場所・お店の名前を入力"><button id="searchBtn">検索</button></div>
      <p class="hint">検索結果を選ぶと地図に移動するよ。地図をタップして場所を追加することもできます。</p>
      <div id="searchResults"></div>
      <div class="section-title">カテゴリー</div>
      <div class="chips" id="filters">
        <button class="chip active" data-filter="all">ぜんぶ</button><button class="chip" data-filter="cafe">☕ カフェ</button><button class="chip" data-filter="restaurant">🍴 レストラン</button><button class="chip" data-filter="spot">🌿 おでかけ</button><button class="chip" data-filter="other">✦ その他</button>
      </div>
      <div class="section-title">行った場所 <span class="count" id="count">0か所</span></div>
      <div class="place-list" id="placeList"><div class="empty">まだピンがありません。<br>最初の「行った場所」を登録してみよう！</div></div>
      <div class="footer">登録した場所はこのブラウザに保存されます。シェアすると、登録した場所を含む地図リンクを作れます。</div>
    </section>
    <section class="map-wrap"><div id="map"></div><div class="map-tip">🗺️ 地図をタップしてピンを追加</div></section>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(() => {
  const KEY='yorimichi-map-places-v1';
  const icons={cafe:'☕',restaurant:'🍴',spot:'🌿',other:'✦'};
  const labels={cafe:'カフェ',restaurant:'レストラン',spot:'おでかけ',other:'その他'};
  const params=new URLSearchParams(location.search);
  let places=[];
  try {
    if(params.has('map')) places=JSON.parse(decodeURIComponent(escape(atob(params.get('map').replace(/-/g,'+').replace(/_/g,'/')))));
    else places=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!Array.isArray(places)) places=[];
  } catch { places=[]; }
  let filter='all', pending=null;
  const map=L.map('map').setView([35.6812,139.7671],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const layer=L.layerGroup().addTo(map);
  const $=id=>document.getElementById(id);
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(places))}catch{}};
  const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){
    layer.clearLayers();
    const visible=places.filter(p=>filter==='all'||p.category===filter);
    visible.forEach(p=>{
      const marker=L.marker([p.lat,p.lng]).addTo(layer);
      marker.bindPopup('<b>'+safe(p.name)+'</b><br><small>'+icons[p.category]+' '+labels[p.category]+'</small>'+(p.note?'<br>'+safe(p.note):''));
    });
    $('count').textContent=places.length+'か所';
    $('placeList').innerHTML=visible.length?visible.map(p=>'<div class="place"><div class="place-icon">'+icons[p.category]+'</div><div class="place-main"><div class="place-name">'+safe(p.name)+'</div><div class="place-meta">'+labels[p.category]+(p.date?' · '+safe(p.date):'')+(p.note?' · '+safe(p.note):'')+'</div></div><button class="ghost" data-go="'+p.id+'" aria-label="地図で見る">地図</button><button class="ghost" data-del="'+p.id+'" aria-label="削除">×</button></div>').join(''):'<div class="empty">このカテゴリーの場所はまだありません。</div>';
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const p=places.find(x=>x.id===b.dataset.go);if(p){map.setView([p.lat,p.lng],16);layer.eachLayer(m=>{if(m.getLatLng().lat===p.lat&&m.getLatLng().lng===p.lng)m.openPopup()})}});
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('この場所を地図から削除しますか？')){places=places.filter(x=>x.id!==b.dataset.del);save();render()}});
  }
  function addPlace(lat,lng,name=''){
    pending={lat,lng,name};
    $('searchResults').innerHTML='<div class="section-title">この場所を登録</div><div class="formgrid"><input class="field" id="placeName" placeholder="場所の名前" value="'+safe(name)+'"><select class="field" id="placeCategory"><option value="cafe">☕ カフェ</option><option value="restaurant">🍴 レストラン</option><option value="spot">🌿 おでかけ</option><option value="other">✦ その他</option></select><input class="field" id="placeNote" placeholder="ひとことメモ（任意）"><label class="hint" for="placeDate">行った日（任意）</label><input class="field" id="placeDate" type="date"><div class="row"><button id="savePlace">保存する</button><button class="secondary" id="cancelPlace">キャンセル</button></div></div>';
    $('savePlace').onclick=()=>{const n=$('placeName').value.trim();if(!n){alert('場所の名前を入力してね');return}places.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,category:$('placeCategory').value,note:$('placeNote').value.trim(),date:$('placeDate').value,lat,lng});save();render();$('searchResults').innerHTML='';};
    $('cancelPlace').onclick=()=>$('searchResults').innerHTML='';
  }
  map.on('click',e=>addPlace(e.latlng.lat,e.latlng.lng));
  $('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
  async function search(){
    const q=$('searchInput').value.trim();if(!q)return;
    $('searchResults').innerHTML='<p class="hint">検索中…</p>';
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q),{headers:{'Accept-Language':'ja'}});
      const data=await r.json();
      $('searchResults').innerHTML=data.length?'<div class="section-title">検索結果</div>'+data.map((x,i)=>'<button class="secondary" style="display:block;width:100%;text-align:left;margin:6px 0;font-size:12px" data-result="'+i+'">'+safe(x.display_name)+'</button>').join(''):'<p class="hint">見つかりませんでした。別の名前で試してみてね。</p>';
      document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const x=data[Number(b.dataset.result)],lat=Number(x.lat),lng=Number(x.lon);map.setView([lat,lng],16);addPlace(lat,lng,x.name||q)});
    }catch{$('searchResults').innerHTML='<p class="hint">検索できませんでした。通信状態を確認してね。</p>'}
  }
  $('searchBtn').onclick=search;$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
  $('locateBtn').onclick=()=>{if(!navigator.geolocation){alert('この端末では現在地を取得できません');return}navigator.geolocation.getCurrentPosition(pos=>map.setView([pos.coords.latitude,pos.coords.longitude],15),()=>alert('現在地を取得できませんでした。位置情報の許可を確認してね。'))};
  $('exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(places,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yorimichi-map.json';a.click();URL.revokeObjectURL(a.href);
  };
  $('importBtn').onclick=()=>$('importFile').click();
  $('importFile').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      if(!Array.isArray(data)||data.some(p=>!p||typeof p.name!=='string'||!Number.isFinite(p.lat)||!Number.isFinite(p.lng)||!['cafe','restaurant','spot','other'].includes(p.category)))throw Error('invalid');
      if(!confirm('現在の地図を読み込んだデータで置き換えますか？'))return;
      places=data;save();render();alert('地図を読み込みました！');
    }catch{alert('読み込めませんでした。わたしの地図のJSONファイルを選んでね。')}
    finally{e.target.value=''}
  };
  $('shareBtn').onclick=async()=>{
    try{
      const bytes=new TextEncoder().encode(JSON.stringify(places));let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
      const encoded=btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      const url=location.origin+location.pathname+'?map='+encoded;
      if(navigator.share)await navigator.share({title:'わたしのよりみちマップ',text:'行った場所をまとめた地図だよ！',url});
      else{await navigator.clipboard.writeText(url);alert('共有リンクをコピーしました！')}
    }catch(e){if(e.name!=='AbortError')alert('共有できませんでした。')}
  };
  render();
  if(places.length){const bounds=L.latLngBounds(places.map(p=>[p.lat,p.lng]));if(bounds.isValid())map.fitBounds(bounds.pad(.18),{maxZoom:14})}
})();
</script>
</body>
</html>
